services:
  app:
    build: .
    command: php artisan serve --host=0.0.0.0 --port=8000
    working_dir: /var/www/app
    volumes:
      - ./app:/var/www/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: invitacion
      MARIADB_USER: invitacion
      MARIADB_PASSWORD: invitacion
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dbdata:
